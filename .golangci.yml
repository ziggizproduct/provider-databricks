# Workspace standard, copied from ziggizproduct/arch. Do not edit in product
# repos. golangci-lint v2: `golangci-lint fmt` formats, `golangci-lint run --fix` lints.
version: "2"

formatters:
  enable:
    - gofumpt
    - goimports

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    nolintlint:
      # Every //nolint names the linter and says why.
      require-specific: true
      require-explanation: true
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
